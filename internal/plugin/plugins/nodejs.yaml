name: nodejs
version: 1.0
detect:
  files: ["package.json"]
commands:
  - name: 安装依赖
    run: "npm install"
  - name: 启动开发服务器
    run: "npm run dev"
  - name: 构建
    run: "npm run build"
  - name: 运行测试
    run: "npm test"
  - name: 代码检查
    run: "npm run lint"
env:
  - name: node
    check: "node --version"
    required: true
  - name: npm
    check: "npm --version"
    required: true
