name: python
version: 1.0
detect:
  files: ["requirements.txt", "pyproject.toml", "setup.py", "Pipfile"]
commands:
  - name: 安装依赖
    run: "pip install -r requirements.txt"
  - name: 运行
    run: "python main.py"
  - name: 运行测试
    run: "pytest"
env:
  - name: python
    check: "python --version"
    required: true
  - name: pip
    check: "pip --version"
    required: true
