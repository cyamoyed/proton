name: go
version: 1.0
detect:
  files: ["go.mod"]
commands:
  - name: 下载依赖
    run: "go mod download"
  - name: 运行
    run: "go run ."
  - name: 构建
    run: "go build ."
  - name: 运行测试
    run: "go test ./..."
  - name: 代码检查
    run: "go vet ./..."
env:
  - name: go
    check: "go version"
    required: true
