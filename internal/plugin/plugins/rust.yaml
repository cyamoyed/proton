name: rust
version: 1.0
detect:
  files: ["Cargo.toml"]
commands:
  - name: 构建
    run: "cargo build"
  - name: 运行
    run: "cargo run"
  - name: 运行测试
    run: "cargo test"
  - name: 代码检查
    run: "cargo clippy"
  - name: 格式化
    run: "cargo fmt"
env:
  - name: rust
    check: "rustc --version"
    required: true
  - name: cargo
    check: "cargo --version"
    required: true
