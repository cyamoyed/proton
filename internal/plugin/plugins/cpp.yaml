name: cpp
version: 1.0
detect:
  files: ["CMakeLists.txt", "meson.build"]
commands:
  - name: 构建（CMake）
    run: "cmake -B build && cmake --build build"
  - name: 构建（Make）
    run: "make"
env:
  - name: cmake
    check: "cmake --version"
    required: false
  - name: make
    check: "make --version"
    required: false
